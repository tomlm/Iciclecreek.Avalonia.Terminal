name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    # Reviewable pull requests only. Three cases this cannot or should not review:
    #   head.repo.fork -- a FORK pull request. GitHub gives these a read-only token, no
    #                     id-token: write and NO SECRETS, so ANTHROPIC_API_KEY arrives
    #                     empty and the action dies on OIDC. Not fixable by permissions;
    #                     pull_request_target would fix it by running fork code WITH the
    #                     secrets, which is worse than no review.
    #   user.type      -- the PR was OPENED by a bot (Copilot and friends).
    #   github.actor   -- a human's PR that Claude then PUSHED to. The push fires
    #                     `synchronize`, and Claude would review its own commit.
    # All three are still reviewable on demand: comment @claude on the PR. That runs on
    # issue_comment, which is a base-repo event and does get the secrets.
    if: github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.type != 'Bot' && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Temporary, for diagnosis. Every run of this workflow has failed since it was added,
          # with `Claude execution failed: result is_error:true` and nothing else -- the SDK
          # reports 512ms, one turn and $0, so the model is never reached, and the action redacts
          # the reason from both the job log and the check annotations. This is the switch that
          # prints it. Remove once the cause is known and fixed.
          show_full_output: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Same gating as claude.yml: .claude/settings.json does not reach the Action, so a
          # reviewer without this cannot build or run the suite, and every finding it reports
          # is unverified reasoning about code it never executed.
          #
          # Unlike claude.yml, this workflow runs in AGENT mode -- it passes `prompt:` -- and
          # agent mode adds NOTHING of its own (src/modes/agent/index.ts). Whatever is not named
          # here does not exist for this run, down to Read.
          #
          # The seven gh rules are the /code-review:code-review command's own `allowed-tools:`
          # frontmatter, restated because agent mode does not read it as a grant. Read/Glob/Grep
          # are the base tools tag mode would have supplied for free. Task is not optional: every
          # step of that command begins "Launch a ... agent", six in total, so without it the
          # review cannot start.
          #
          # The MCP entry is the one that fails silently rather than loudly. The action only
          # starts the inline-comment server when a tool matching mcp__github_inline_comment
          # appears in allowedTools (src/mcp/install-mcp-server.ts:150) -- omitting it does not
          # deny a call, it removes the server, so the review posts nothing inline however much
          # it found.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowedTools "Bash(dotnet:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Read,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment"'
