name: Publish Nuget Prerelease

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Determine prerelease version
        id: versioning
        run: |
          CSPROJ=$(find src -name "*.csproj" -not -name "*Test*" | head -1)
          BASE_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$CSPROJ" | sed 's/-.*//' || true)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' "$CSPROJ" | sed 's/-.*//' || true)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0.0"
          fi
          PKG_ID=$(grep -oPm1 '(?<=<PackageId>)[^<]+' "$CSPROJ" || basename "$CSPROJ" .csproj)
          PKG_LOWER=$(echo "$PKG_ID" | tr '[:upper:]' '[:lower:]')
          VERSIONS=$(curl -sS "https://api.nuget.org/v3-flatcontainer/${PKG_LOWER}/index.json" | jq -r '.versions[]' 2>/dev/null || echo "")
          ESCAPED_VERSION=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
          MAX_RC=$(echo "$VERSIONS" | grep -oP "^${ESCAPED_VERSION}-rc\K[0-9]+" | sort -n | tail -1)
          if [ -z "$MAX_RC" ]; then
            NEXT_RC=1
          else
            NEXT_RC=$((MAX_RC + 1))
          fi
          PRERELEASE_VERSION="${BASE_VERSION}-rc$(printf '%03d' $NEXT_RC)"
          echo "version=$PRERELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Prerelease version: $PRERELEASE_VERSION"

      - name: Restore dependencies
        run: dotnet restore src/Iciclecreek.Avalonia.TerminalWindow.slnx

      - name: Build
        run: dotnet build src/Iciclecreek.Avalonia.TerminalWindow.slnx -c Release --no-restore

      - name: dotnet pack
        run: |
          dotnet pack src/Iciclecreek.Avalonia.TerminalWindow.slnx -c Release -o packages --include-symbols --property WarningLevel=0 /p:Version=${{ steps.versioning.outputs.version }}

      - name: Publish NuGet and symbols
        id: nuget-push
        uses: edumserrano/nuget-push@v1
        with:
          api-key: '${{ secrets.NUGET_KEY }}'
          working-directory: 'packages'
          fail-if-exists: false

